<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>🎯 的中バナー&ページ生成 (スタッフ版)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    pre { white-space: pre-wrap; word-break: break-all; line-height: 1.6; }
  </style>
</head>
<body class="bg-amber-50 p-6">
  
  <div class="max-w-6xl mx-auto bg-white rounded-2xl shadow-xl p-8 border-2 border-amber-200">
    <!-- タイトル -->
    <div class="flex justify-between items-center mb-8 pb-4 border-b border-amber-100">
      <div class="flex items-center gap-3">
        <span class="text-4xl">🎯</span>
        <h1 class="text-3xl font-bold text-amber-900">的中データ生成ツール</h1>
      </div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
      <!-- 入力エリア -->
      <div class="space-y-6">
        <div class="flex flex-wrap items-center gap-4">
          <label class="flex items-center gap-2 text-sm font-medium text-amber-900">
            <input type="checkbox" id="limited" class="w-5 h-5 text-amber-600 border-amber-300 rounded focus:ring-amber-500">
            参加者限定
          </label>
          <label class="flex items-center gap-2 text-sm font-medium text-amber-900">
            <input type="checkbox" id="dendou" class="w-5 h-5 text-amber-600 border-amber-300 rounded focus:ring-amber-500">
            殿堂万券
          </label>
          <label class="flex items-center gap-2 text-sm font-medium text-amber-900">
            <input type="checkbox" id="graded" class="w-5 h-5 text-amber-600 border-amber-300 rounded focus:ring-amber-500">
            重賞
          </label>
        </div>

        <div id="gradedNameWrap" class="hidden">
          <label class="block text-sm mb-1 font-medium text-amber-900">重賞レース名</label>
          <input id="gradedName" placeholder="例: 阪神ジャンプS" class="w-full border border-amber-300 p-3 rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-500">
        </div>

        <div>
          <label class="block text-sm mb-1 font-medium text-amber-900">キャラクター選択 (Ｕトラ等)</label>
          <select id="character" class="w-full border border-amber-300 p-3 rounded-lg bg-amber-50/50 focus:outline-none focus:ring-2 focus:ring-amber-500">
            <option value="ico_tra_ishii">石井代表</option>
            <option value="ico_tra_kenta">マンダケンタ</option>
            <option value="ico_tra_t">Ｔトラ</option>
            <option value="ico_tra_j">Ｊトラ</option>
            <option value="ico_tra_z">Ｚトラ</option>
            <option value="ico_tra_e">Ｅトラ</option>
            <option value="ico_tra_h">Ｈトラ</option>
            <option value="ico_tra_n">Ｎトラ</option>
            <option value="ico_tra_u" selected>Ｕトラ</option>
            <option value="ico_tra_o">Ｏトラ</option>
            <option value="ico_tra_y">Ｙトラ</option>
            <option value="ico_tra_m">Ｍトラ</option>
            <option value="ico_tra_c">Ｃトラ</option>
            <option value="ico_tra_k">Ｋトラ</option>
            <option value="ico_tra_santa">Mr.サンタ</option>
            <option value="ico_tra_w">Ｗトラ</option>
            <option value="ico_tra_x">Ｘトラ</option>
            <option value="ico_tra_kuromaku">黒幕</option>
            <option value="ico_tra_ouji">暴露王子</option>
            <option value="ico_tra_local">チームトゥインクル</option>
            <option value="ico_tra_hokkaido">チーム北海道</option>
            <option value="ico_bakuro">参加者限定</option>
          </select>
        </div>

        <div>
          <label class="block text-sm mb-1 font-medium text-amber-900">情報</label>
          <input id="customInfo" value="" class="w-full border border-amber-300 p-3 rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-500">
        </div>

        <!-- 的中情報のテキスト一括貼り付けエリア -->
        <div>
          <label class="block text-sm mb-1 font-medium text-amber-900">的中情報のテキスト塊（ここに貼り付け）</label>
          <textarea id="rawInput" rows="10" class="w-full border border-amber-300 p-4 rounded-lg font-mono text-sm focus:outline-none focus:ring-2 focus:ring-amber-500" placeholder=""></textarea>
        </div>
      </div>

      <!-- 出力エリア -->
      <div>
        <button onclick="generateOutput()" class="w-full bg-amber-500 hover:bg-amber-600 text-white py-4 rounded-xl text-lg font-bold shadow-md transition mb-6">
          🔄 データを生成する
        </button>

        <div>
          <h3 class="font-bold mb-2 text-amber-900">出力結果（整形後）</h3>
          <pre id="output" class="bg-gray-900 text-green-300 p-5 rounded-xl text-sm h-96 overflow-auto border border-amber-300"></pre>
          <button onclick="copyText('output')" class="mt-3 px-4 py-2 bg-amber-500 hover:bg-amber-600 text-white font-bold rounded-lg text-sm shadow transition">コピーする</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const charNameMap = {
      "ico_tra_ishii": "石井代表",
      "ico_tra_kenta": "マンダケンタ",
      "ico_tra_t": "Ｔトラ",
      "ico_tra_j": "Ｊトラ",
      "ico_tra_z": "Ｚトラ",
      "ico_tra_e": "Ｅトラ",
      "ico_tra_h": "Ｈトラ",
      "ico_tra_n": "Ｎトラ",
      "ico_tra_u": "Uトラ",
      "ico_tra_o": "Ｏトラ",
      "ico_tra_y": "Ｙトラ",
      "ico_tra_m": "Ｍトラ",
      "ico_tra_c": "Ｃトラ",
      "ico_tra_k": "Ｋトラ",
      "ico_tra_santa": "Mr.サンタ",
      "ico_tra_w": "Ｗトラ",
      "ico_tra_x": "Ｘトラ",
      "ico_tra_kuromaku": "黒幕",
      "ico_tra_ouji": "暴露王子",
      "ico_tra_local": "チームトゥインクル",
      "ico_tra_hokkaido": "チーム北海道",
      "ico_bakuro": "参加者限定"
    };

    const charPathMap = {
      "ico_tra_ishii": "ishii",
      "ico_tra_kenta": "kenta",
      "ico_tra_t": "t",
      "ico_tra_j": "j",
      "ico_tra_z": "z",
      "ico_tra_e": "e",
      "ico_tra_h": "h",
      "ico_tra_n": "n",
      "ico_tra_u": "u",
      "ico_tra_o": "o",
      "ico_tra_y": "y",
      "ico_tra_m": "m",
      "ico_tra_c": "c",
      "ico_tra_k": "k",
      "ico_tra_santa": "santa",
      "ico_tra_w": "w",
      "ico_tra_x": "x",
      "ico_tra_kuromaku": "kuromaku",
      "ico_tra_ouji": "ouji",
      "ico_tra_local": "local",
      "ico_tra_hokkaido": "hokkaido",
      "ico_bakuro": "" // 参加者限定の時はリンクなし
    };

    function toHalfWidth(str) {
      if (!str) return "";
      return str.replace(/[０-９Ａ-Ｚａ-ｚ（）]/g, function(s) {
        return String.fromCharCode(s.charCodeAt(0) - 0xFEE0);
      }).replace(/[～〜]/g, "~");
    }

    function parseAmountToValue(numStr) {
      if (!numStr) return 0;
      let clean = numStr.replace(/円/g, "").replace(/\s+/g, "").trim();
      let total = 0;
      if (clean.includes("万")) {
        let parts = clean.split("万");
        let man = parseInt(parts[0], 10) || 0;
        let rest = parseInt(parts[1], 10) || 0;
        total = man * 10000 + rest;
      } else {
        total = parseInt(clean, 10) || 0;
      }
      return total;
    }

    function generateOutput() {
      const rawText = document.getElementById('rawInput').value;
      const charKey = document.getElementById('character').value;
      const customInfo = document.getElementById('customInfo').value;
      const limited = document.getElementById('limited')?.checked || false;
      const dendou = document.getElementById('dendou')?.checked || false;
      const graded = document.getElementById('graded')?.checked || false;
      const gradedName = document.getElementById('gradedName')?.value.trim() || "";
      
      const charDisplayName = charNameMap[charKey] || "Uトラ";
      const charPath = charPathMap[charKey];
      
      let dateLine = "";
      let raceTitleLine = "";
      let horses = [];
      let payoutsList = [];

      const lines = rawText.split('\n').map(l => l.trim()).filter(l => l !== "");

      for (let i = 0; i < lines.length; i++) {
        let line = lines[i];
        if (line.includes("月") || line.includes("年") || line.includes("日") || line.includes("(土)") || line.includes("(日)") || line.includes("(祝)")) {
          dateLine = line;
        } 
        else if (line.startsWith("『") || line.includes("『")) {
          raceTitleLine = line.replace(/[『』]/g, "").replace(/サラ系/g, "");
        }
        else if (/^[◎◯〇▲△★].+/.test(line)) {
          let mark = line.charAt(0);
          if (mark === "★") mark = "△";
          let horseName = line.substring(1).trim();
          let popNum = "";
          
          if (i + 1 < lines.length && (lines[i+1].includes("人気") || lines[i+1].includes("人気・"))) {
            let nextLine = toHalfWidth(lines[i+1]);
            let popMatch = nextLine.match(/(\d+)人気/);
            if (popMatch) {
              popNum = popMatch[1];
            }
            i++;
          }
          horses.push({ mark, horseName, popNum });
        }
        else if (line.includes("連単") || line.includes("連複") || line.includes("馬単") || line.includes("馬連") || line.includes("ワイド") || line.includes("単勝") || line.includes("複勝") || line.includes("３連単") || line.includes("３連複") || line.includes("3連単") || line.includes("3連複") || line.includes("馬　単") || line.includes("馬　連")) {
          let halfLine = toHalfWidth(line);
          let cleanLine = halfLine.replace(/[\s　]+/g, "");
          
          let kind = "";
          if (cleanLine.includes("3連単") || cleanLine.includes("３連単")) kind = "３連単";
          else if (cleanLine.includes("3連複") || cleanLine.includes("３連複")) kind = "３連複";
          else if (cleanLine.includes("馬単")) kind = "馬単";
          else if (cleanLine.includes("馬連")) kind = "馬連";

          if (kind) {
            let val = cleanLine.replace(/([3３]連単|[3３]連複|馬単|馬連)/g, "").replace(/的中/g, "").trim();
            let numericVal = parseAmountToValue(val);
            payoutsList.push({ kind, val, numericVal });
          }
        }
      }

      payoutsList.sort((a, b) => b.numericVal - a.numericVal);

      let formattedDate = toHalfWidth(dateLine);
      formattedDate = formattedDate
        .replace(/^\d+年/, "")
        .replace(/月/, "/")
        .replace(/日/, "")
        .replace(/Ｒ/g, "R")
        .replace(/\s+/g, " ");
      if (graded && gradedName) {
        let datePart = formattedDate.replace(/\s+\S+$/, "").trim();
        formattedDate = datePart + " " + gradedName + " ";
      }
      if (limited) {
        formattedDate += ` <span class="red bold">参加者限定</span>`;
      }
      if (dendou) {
        formattedDate += ` <span class="red bold">殿堂万券</span>`;
      }

      // 馬情報のHTML生成（常に3頭分の高さを確保）
      let horseHtmlArr = [];
      horses.forEach(h => {
        let popTag = h.popNum ? `<span class='hit-s__ninki' style='background-color:#3261AB;'>${h.popNum}人気</span>` : "";
        horseHtmlArr.push(`${h.mark}${h.horseName}${popTag}`);
      });
      // 3頭未満の場合は空行を追加して1頭分のスペースを確保
      while (horseHtmlArr.length < 3) {
        horseHtmlArr.push("&nbsp;");
      }
      let horseHtmlStr = horseHtmlArr.join("<br>");

      function formatAmountHtml(numStr) {
        let clean = numStr.replace(/円/g, "").trim();
        if (clean.includes("万")) {
          let parts = clean.split("万");
          let man = parts[0];
          let rest = parts[1] || "";
          return `<span class="hit-s__num">${man}</span>万<span class="hit-s__num">${rest}</span>`;
        } else {
          return `<span class="hit-s__num">　</span>　<span class="hit-s__num">${clean}</span>`;
        }
      }

      let payoutHtmlParts = [];
      for (let i = 0; i < payoutsList.length; i++) {
        let item = payoutsList[i];
        payoutHtmlParts.push(`<span class="hit-s__kinds">${item.kind}</span>${formatAmountHtml(item.val)}円的中`);
      }
      
      for (let i = payoutsList.length; i < 3; i++) {
        payoutHtmlParts.push('<span class="hit-s__kinds">　</span><span class="hit-s__num">　</span>　<span class="hit-s__num">　</span>');
      }
      
      let payoutHTML = payoutHtmlParts.join("");

      // スタッフ部分のHTML生成（ico_bakuroの時はリンクなし）
      let staffHtml = "";
      if (charPath === "") {
        staffHtml = `<div class="ac-staffs_ico"><img src="<?php echo $cache_url; ?>/img/main/${charKey}.png?<?php echo CommonString::filemtime($_SERVER['DOCUMENT_ROOT']. "/img/main/${charKey}.png"); ?>" alt=""></div>${charDisplayName}`;
      } else {
        staffHtml = `<a href="/trackman/${charPath}/" class="ac-staffs__wrap trig-colorbox_iframe"><div class="ac-staffs_ico"><img src="<?php echo $cache_url; ?>/img/main/${charKey}.png?<?php echo CommonString::filemtime($_SERVER['DOCUMENT_ROOT']. "/img/main/${charKey}.png"); ?>" alt=""></div>${charDisplayName}</a>`;
      }

      const result = `<!-- 的中一つ分ここから --><div class="swiper-slide hit"><div class="hit-s__header"><ul class="ac-staffs"><li>${staffHtml}</li></ul></div><!--hit-s__header --><ul class="hit-s__detailWrap"><li><span class="hit-s__race">${formattedDate}</span>${horseHtmlStr}</li>
<li class="hit-s__amount">${payoutHTML}</li><li><span class="hit-s__miniTtl">情報</span><br>${customInfo}</li></ul></div><!-- 的中一つ分ここまで -->`;

      document.getElementById('output').textContent = result;
    }

    function copyText(id) {
      const text = document.getElementById(id).textContent;
      navigator.clipboard.writeText(text).then(() => alert('コピーしました！'));
    }

    function logout() {
      if (confirm("ログアウトしますか？")) {
        window.location.href = "login.html";
      }
    }

    document.getElementById('graded')?.addEventListener('change', function() {
      const wrap = document.getElementById('gradedNameWrap');
      if (this.checked) {
        wrap.classList.remove('hidden');
      } else {
        wrap.classList.add('hidden');
      }
    });
  </script>
</body>
</html>
